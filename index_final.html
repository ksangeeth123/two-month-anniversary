<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Our Story | Anniversary</title>
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,400;0,700;1,400;1,700&display=swap" rel="stylesheet">
    
    <!-- Libraries -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/framer-motion@10.16.4/dist/framer-motion.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'accent-rose': '#ff4d6d',
                        'accent-pink': '#ff758f',
                        'accent-deep': '#590d22',
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        serif: ['Playfair Display', 'serif'],
                    }
                }
            }
        }
    </script>

    <style>
        :root {
            --accent-rose: #ff4d6d;
            --accent-pink: #ff758f;
            --bg-gradient: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            --glass-bg: rgba(255, 255, 255, 0.08);
            --glass-border: rgba(255, 255, 255, 0.15);
        }

        body {
            margin: 0;
            background: var(--bg-gradient);
            background-attachment: fixed;
            color: white;
            overflow-x: hidden;
            min-height: 100vh;
        }

        .glass {
            background: var(--glass-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        }

        .text-gradient {
            background: linear-gradient(to right, var(--accent-rose), var(--accent-pink));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: var(--accent-rose); border-radius: 10px; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;
        const { motion, AnimatePresence } = FramerMotion;

        // --- Icons Wrapper ---
        const Icon = ({ name, size = 20, className = "", fill = "none" }) => {
            const [iconMarkup, setIconMarkup] = useState("");
            
            useEffect(() => {
                if (window.lucide) {
                    const icon = window.lucide.icons[name];
                    if (icon) {
                        // This is a bit of a hack for standalone Lucide
                        const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
                        svg.setAttribute("width", size);
                        svg.setAttribute("height", size);
                        svg.setAttribute("viewBox", "0 0 24 24");
                        svg.setAttribute("fill", fill);
                        svg.setAttribute("stroke", "currentColor");
                        svg.setAttribute("stroke-width", "2");
                        svg.setAttribute("stroke-linecap", "round");
                        svg.setAttribute("stroke-linejoin", "round");
                        svg.classList.add(...className.split(" "));
                        
                        icon[1].forEach(tag => {
                            const element = document.createElementNS("http://www.w3.org/2000/svg", tag[0]);
                            Object.entries(tag[1]).forEach(([k, v]) => element.setAttribute(k, v));
                            svg.appendChild(element);
                        });
                        setIconMarkup(svg.outerHTML);
                    }
                }
            }, [name, size, className, fill]);

            return <span dangerouslySetInnerHTML={{ __html: iconMarkup }} />;
        };

        // --- Heart Background Component ---
        const HeartBackground = () => {
            const canvasRef = useRef(null);

            useEffect(() => {
                const canvas = canvasRef.current;
                const ctx = canvas.getContext('2d');
                let hearts = [];

                const resize = () => {
                    canvas.width = window.innerWidth;
                    canvas.height = window.innerHeight;
                };

                window.addEventListener('resize', resize);
                resize();

                class Heart {
                    constructor() { this.reset(); }
                    reset() {
                        this.x = Math.random() * canvas.width;
                        this.y = canvas.height + Math.random() * 200;
                        this.size = Math.random() * 12 + 4;
                        this.speed = Math.random() * 0.8 + 0.3;
                        this.opacity = Math.random() * 0.3 + 0.1;
                        this.wiggleSpeed = Math.random() * 0.03;
                        this.time = Math.random() * 100;
                    }
                    draw() {
                        ctx.save();
                        ctx.globalAlpha = this.opacity;
                        ctx.fillStyle = '#ff4d6d';
                        ctx.translate(this.x + Math.sin(this.time) * 15, this.y);
                        ctx.beginPath();
                        const d = this.size;
                        ctx.moveTo(0, 0);
                        ctx.bezierCurveTo(-d/2, -d/2, -d, d/4, 0, d*0.75);
                        ctx.bezierCurveTo(d, d/4, d/2, -d/2, 0, 0);
                        ctx.fill();
                        ctx.restore();
                        this.y -= this.speed;
                        this.time += this.wiggleSpeed;
                        if (this.y < -50) this.reset();
                    }
                }

                hearts = Array.from({ length: 25 }, () => new Heart());
                const animate = () => {
                    ctx.clearRect(0, 0, canvas.width, canvas.height);
                    hearts.forEach(h => h.draw());
                    requestAnimationFrame(animate);
                };
                animate();
                return () => window.removeEventListener('resize', resize);
            }, []);

            return <canvas ref={canvasRef} className="fixed inset-0 pointer-events-none z-0 opacity-60" />;
        };

        // --- Home Component ---
        const Home = () => {
            const startDate = new Date('2026-02-04T00:00:00');
            const [duration, setDuration] = useState({ days: 0, hours: 0, minutes: 0, seconds: 0 });

            useEffect(() => {
                const timer = setInterval(() => {
                    const diff = new Date() - startDate;
                    setDuration({
                        days: Math.floor(diff / (1000 * 60 * 60 * 24)),
                        hours: Math.floor((diff / (1000 * 60 * 60)) % 24),
                        minutes: Math.floor((diff / (1000 * 60)) % 60),
                        seconds: Math.floor((diff / 1000) % 60)
                    });
                }, 1000);
                return () => clearInterval(timer);
            }, []);

            return (
                <div className="flex flex-col items-center justify-center min-h-[70vh] text-center px-4">
                    <motion.div initial={{ scale: 0 }} animate={{ scale: 1 }} className="mb-8 relative">
                        <Icon name="Heart" size={120} className="text-accent-rose animate-pulse" fill="rgba(255, 77, 109, 0.2)" />
                        <div className="absolute inset-0 flex items-center justify-center text-white font-bold text-2xl">2</div>
                    </motion.div>
                    <motion.h1 className="text-5xl md:text-8xl mb-2 text-gradient font-serif font-bold italic">My Princess</motion.h1>
                    <div className="flex items-center gap-3 text-white/50 text-sm uppercase tracking-[0.3em] font-semibold mb-10">
                        <div className="h-[1px] w-8 bg-white/20" /> Our Forever Since Feb 4, 2026 <div className="h-[1px] w-8 bg-white/20" />
                    </div>
                    <p className="text-xl md:text-2xl text-white/80 mb-12 max-w-2xl font-serif italic italic leading-relaxed">
                        "Every single day with you is a gift I never knew I deserved. These first two months are just the beginning of our beautiful forever."
                    </p>
                    <div className="grid grid-cols-2 lg:grid-cols-4 gap-4 md:gap-6 w-full max-w-4xl">
                        {Object.entries(duration).map(([label, val], idx) => (
                            <div key={idx} className="glass p-8 flex flex-col items-center justify-center relative overflow-hidden group hover:bg-white/10 transition-colors">
                                <span className="text-5xl md:text-6xl font-bold text-white mb-2 tracking-tighter">{val}</span>
                                <span className="text-xs uppercase tracking-[0.2em] text-accent-pink font-bold">{label}</span>
                            </div>
                        ))}
                    </div>
                </div>
            );
        };

        // --- Gallery Component ---
        const Gallery = () => {
            const [selectedImg, setSelectedImg] = useState(null);
            const images = [
                { url: './public/WhatsApp Image 2026-04-02 at 6.29.46 PM.jpeg', title: 'Sweet Moments' },
                { url: './public/WhatsApp Image 2026-04-02 at 6.34.14 PM.jpeg', title: 'Our Happiness' },
                { url: './public/WhatsApp Image 2026-04-02 at 6.39.01 PM.jpeg', title: 'Together Always' },
                { url: './public/WhatsApp Image 2026-04-02 at 7.20.57 PM.jpeg', title: 'Beautiful Memories' },
                { url: './public/WhatsApp Image 2026-04-02 at 7.23.58 PM.jpeg', title: 'My Everything' }
            ];

            return (
                <div className="px-4 py-10">
                    <h2 className="text-4xl md:text-5xl font-serif text-center mb-12 text-gradient">Our Gallery</h2>
                    <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
                        {images.map((img, idx) => (
                            <motion.div key={idx} onClick={() => setSelectedImg(img)} className="glass overflow-hidden cursor-pointer group relative aspect-[4/5] border-none">
                                <img src={img.url} className="w-full h-full object-cover transition-transform duration-700 group-hover:scale-110" />
                                <div className="absolute inset-0 bg-gradient-to-t from-accent-deep/80 via-transparent to-transparent opacity-0 group-hover:opacity-100 transition-all duration-500 flex flex-col justify-end p-8">
                                    <p className="text-white font-serif text-2xl italic mb-2">{img.title}</p>
                                    <div className="h-1 w-12 bg-accent-rose rounded-full transform origin-left scale-x-0 group-hover:scale-x-100 transition-transform duration-500" />
                                </div>
                            </motion.div>
                        ))}
                    </div>
                    {selectedImg && (
                        <div onClick={() => setSelectedImg(null)} className="fixed inset-0 z-[100] bg-black/90 backdrop-blur-md flex items-center justify-center p-4">
                            <img src={selectedImg.url} className="max-w-full max-h-full rounded-lg shadow-2xl object-contain" />
                        </div>
                    )}
                </div>
            );
        };

        // --- Timeline Component ---
        const Timeline = () => {
            const data = [
                { date: 'Feb 4, 2026', title: 'The First Spark', desc: 'Our very first chat... and the moment I knew. I told you I loved you for the first time.', icon: 'MessageCircle' },
                { date: 'Feb 14, 2026', title: 'A Valentine’s Dream', desc: 'At 11:52 PM, you said those three magical words back to me. My heart finally found its home.', icon: 'Heart' },
                { date: 'Apr 1, 2026', title: 'The First Meet', desc: 'Finally meeting you in person. Seeing your smile for the first time was more than I ever imagined.', icon: 'Users' }
            ];

            return (
                <div className="py-10 relative">
                    <h2 className="text-4xl md:text-5xl font-serif text-center mb-20 text-gradient">Our Journey</h2>
                    <div className="absolute left-1/2 top-40 bottom-20 w-0.5 bg-accent-rose/30 hidden md:block" />
                    {data.map((item, idx) => (
                        <div key={idx} className={`flex flex-col md:flex-row items-center justify-center mb-16 relative w-full lg:max-w-4xl mx-auto ${idx % 2 === 0 ? '' : 'md:flex-row-reverse'}`}>
                            <div className="hidden md:flex w-[45%] justify-end px-12"><span className="text-2xl font-serif text-white/50">{item.date}</span></div>
                            <div className="w-12 h-12 rounded-full glass border-2 border-accent-rose flex items-center justify-center z-10 bg-black"><Icon name={item.icon} className="text-accent-rose" /></div>
                            <div className="w-full md:w-[45%] mt-8 md:mt-0 px-12">
                                <div className="glass p-10 hover:shadow-[0_0_30px_rgba(255,117,143,0.2)] transition-all">
                                    <h3 className="text-3xl font-serif mb-4 text-white leading-tight">{item.title}</h3>
                                    <p className="text-white/70 text-lg leading-relaxed font-serif italic">"{item.desc}"</p>
                                </div>
                            </div>
                        </div>
                    ))}
                </div>
            );
        };

        // --- Love Letter Component ---
        const LoveLetter = () => {
            const [isOpen, setIsOpen] = useState(false);
            return (
                <div className="min-h-[80vh] flex flex-col items-center justify-center py-10 px-4">
                    <h2 className="text-4xl md:text-5xl font-serif text-center mb-16 text-gradient">A Message For You</h2>
                    <div className="relative w-full max-w-2xl flex items-center justify-center">
                        <AnimatePresence mode="wait">
                            {!isOpen ? (
                                <motion.div key="env" onClick={() => setIsOpen(true)} className="w-full h-80 glass flex flex-col items-center justify-center cursor-pointer shadow-xl relative group overflow-hidden border-2 border-accent-rose/30">
                                    <Icon name="Heart" size={60} fill="#ff4d6d" className="text-accent-rose animate-bounce" />
                                    <p className="mt-6 text-white font-serif text-xl italic z-10">From My Heart to Yours</p>
                                </motion.div>
                            ) : (
                                <motion.div key="let" className="w-full glass p-12 shadow-2xl relative overflow-hidden bg-white/10 italic">
                                    <h3 className="text-3xl font-serif text-accent-pink mb-8 italic">My Dearest Love,</h3>
                                    <p className="text-white/80 text-xl leading-relaxed mb-6 font-serif italic">"These past two months have been the most incredible chapter of my life. You are my happiness, my peace, and my greatest adventure."</p>
                                    <p className="text-white/80 text-xl leading-relaxed mb-6 font-serif italic">"I love you more than words can ever say. Happy Two Months, Princess."</p>
                                    <div className="mt-12 text-right">
                                        <p className="text-white/60 font-serif text-lg italic">Yours Forever,</p>
                                        <p className="text-2xl font-serif text-accent-rose font-bold italic">Your Love</p>
                                    </div>
                                    <button onClick={() => setIsOpen(false)} className="absolute top-4 right-4 text-white/30 hover:text-white uppercase tracking-widest text-xs">Close</button>
                                </motion.div>
                            )}
                        </AnimatePresence>
                    </div>
                </div>
            );
        };

        // --- Main App ---
        const App = () => {
            const [activeTab, setActiveTab] = useState('home');
            const [isPlaying, setIsPlaying] = useState(false);
            const audioRef = useRef(new Audio('https://www.soundhelix.com/examples/mp3/SoundHelix-Song-8.mp3'));

            const toggleMusic = () => {
                if (isPlaying) audioRef.current.pause();
                else audioRef.current.play().catch(e => console.log(e));
                setIsPlaying(!isPlaying);
            };

            const tabs = [
                { id: 'home', icon: 'Heart', label: 'Home' },
                { id: 'gallery', icon: 'Image', label: 'Gallery' },
                { id: 'timeline', icon: 'Calendar', label: 'Timeline' },
                { id: 'letter', icon: 'MessageCircle', label: 'Letter' }
            ];

            return (
                <div className="relative min-h-screen">
                    <HeartBackground />
                    <nav className="fixed top-0 left-0 right-0 z-50 glass m-4 border-none shadow-xl px-6 py-4 flex items-center justify-between">
                        <div className="flex items-center gap-2"><Icon name="Heart" className="text-accent-rose" fill="#ff4d6d" /><span className="font-serif font-bold text-xl">Our Story</span></div>
                        <div className="hidden md:flex gap-8">
                            {tabs.map(t => (
                                <button key={t.id} onClick={() => setActiveTab(t.id)} className={`flex items-center gap-2 text-sm font-medium ${activeTab === t.id ? 'text-accent-rose' : 'text-white/60'}`}>
                                    <Icon name={t.icon} size={18} /> {t.label}
                                </button>
                            ))}
                        </div>
                    </nav>

                    <main className="pt-32 pb-10 container mx-auto px-4 max-w-6xl">
                        <AnimatePresence mode="wait">
                            <motion.div key={activeTab} initial={{ opacity: 0, y: 20 }} animate={{ opacity: 1, y: 0 }} exit={{ opacity: 0, y: -20 }}>
                                {activeTab === 'home' && <Home />}
                                {activeTab === 'gallery' && <Gallery />}
                                {activeTab === 'timeline' && <Timeline />}
                                {activeTab === 'letter' && <LoveLetter />}
                            </motion.div>
                        </AnimatePresence>
                    </main>

                    <div className="fixed bottom-6 right-6 z-50">
                        <button onClick={toggleMusic} className={`p-4 rounded-full glass border-none shadow-lg transition-all ${isPlaying ? 'text-accent-rose bg-white/10 ring-2 ring-accent-rose/50' : 'text-white/40'}`}>
                            <Icon name="Music" className={isPlaying ? 'animate-spin' : ''} />
                        </button>
                    </div>
                </div>
            );
        };

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
